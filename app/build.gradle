plugins {
    id 'com.android.application'
}

android {
    namespace 'com.somar.representacoes'
    compileSdk 35

    defaultConfig {
        applicationId 'com.somar.representacoes'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName '4.1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
